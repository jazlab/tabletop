[project]
name = "virtual-tabletop"
version = "0.1.0"
description = "ROS-free MuJoCo model of the TableTop rig, tasks, and bag replay"
requires-python = "~=3.12.0"
dependencies = [
  "mujoco>=3.3",
  "numpy",
  "pyyaml",
  "scipy",
  "pillow",
  "imageio",
  "imageio-ffmpeg",
  "trimesh",
  "pycollada",
  "mcap",
  "mcap-ros2-support",
  "xacro",
  "gymnasium",
]

[project.optional-dependencies]
# STEP -> mesh conversion for the rig CAD files
cad = ["cascadio"]
rl = [
    "stable-baselines3>=2.4",
    "tensorboard>=2.21.0",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/virtual_tabletop"]

[project.scripts]
vtt-build = "virtual_tabletop.assets.build:main"
vtt-bag-info = "virtual_tabletop.bags.reader:main"
vtt-replay = "virtual_tabletop.replay.player:main"
vtt-clips = "virtual_tabletop.task.motion:main"
vtt-parity = "virtual_tabletop.task.parity:main"
vtt-rl-demo = "virtual_tabletop.rl.demo:main"
vtt-arm-explorer = "virtual_tabletop.design.arm_explorer:main"
vtt-arm-report = "virtual_tabletop.design.arm_report:main"
vtt-object-sheets = "virtual_tabletop.design.object_sheets:main"
vtt-button-reach = "virtual_tabletop.design.button_reach:main"
vtt-rl-train = "virtual_tabletop.training.train:main"
vtt-rl-eval = "virtual_tabletop.training.evaluate:main"

[tool.pytest.ini_options]
markers = [
    "slow: multi-second tests (optimisation, long episodes); skip with -m 'not slow'",
]
