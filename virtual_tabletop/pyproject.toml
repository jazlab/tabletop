[project]
name = "virtual-tabletop"
version = "0.1.0"
description = "ROS-free MuJoCo model of the TableTop rig, tasks, and bag replay"
requires-python = "~=3.12.0"
dependencies = [
  "mujoco>=3.3",
  "numpy",
  "pyyaml",
  "scipy",
  "pillow",
  "imageio",
  "imageio-ffmpeg",
  "trimesh",
  "pycollada",
  "mcap",
  "mcap-ros2-support",
  "xacro",
]

[project.optional-dependencies]
# STEP -> mesh conversion for the rig CAD files
cad = ["cascadio"]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/virtual_tabletop"]

[project.scripts]
vtt-build = "virtual_tabletop.assets.build:main"
vtt-bag-info = "virtual_tabletop.bags.reader:main"
vtt-replay = "virtual_tabletop.replay.player:main"
