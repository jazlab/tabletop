mix:
  - [rnd, 1.0, {feats: interaction}]
  - [smooth, 1.0, {w_effort: 0.1, w_jerk: 0.2}]
env: {hand: v1, shapes: v1, demo_trials: 6, demo_restart_p: 0.5, demo_tmin: 0.8}
schedule: {demo_restart_p: [0.5, 0.1, 0.6], demo_tmin: [0.8, 0.0, 0.6]}
demos: {path: version_1/demos/smoke.npz, frac: 0.25, bc: [1.0, 0.0, 0.5]}
steps: 12000
warmup: 4000
log_every: 6000
