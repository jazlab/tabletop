# Sim-only rig details that no rig source file records. Everything else in the
# generated model comes from the rig's own files (xacro, launch, SRDF,
# commander.yaml, rig.step). Positions are world frame, meters (REP 103).

# The monkey: virtual_tabletop/monkey_arm/right_arm_fingers_v0.xml (7 arm +
# 16 finger joints, joint motors, no muscles; right_arm_v0.xml is the
# muSim-derived muscle arm, without fingers)
# and its mirror image as the left arm (generated; see assets/subject.py).
# The arm's own frame is +x forward, +z up, +y toward the midline; a yaw of
# +90 deg makes it face into the rig (+y), with the subject's right at +x.
subject:
  arm_file: monkey_arm/right_arm_fingers_v0.xml
  # Shoulders 6.75 cm either side of the rig midline (x = 0.9525), near the
  # frame's front face (posts span y 0.064-0.140), near presentation height.
  # Moved 2 cm forward (y 0.05 -> 0.07; user, 2026-10-31) for the shorter
  # finger arm, whose fingertip otherwise stopped 1.2 cm short of the
  # presented object (~0.345 m away now). Reach is still near full extension.
  arms:
    right:
      shoulder_position: [1.02, 0.07, 0.70]
      yaw: 1.5708
    left:
      shoulder_position: [0.885, 0.07, 0.70]
      yaw: 1.5708

# Smartglass pane (switchable occluder). Not in rig.step; ASSUMED to fill
# the presentation opening between the 1530-LS extrusions: x 0.674-1.233
# (inner faces of 1530-LS_13:1/2), z 0.472-1.220 (top of 1530-LS_..943:1 to
# bottom of 1530-LS_..943:2), in the extrusion plane y 0.102-0.140.
smartglass:
  center: [0.9535, 0.121, 0.846]
  size: [0.559, 0.006, 0.748]
  occluded_rgba: [0.85, 0.87, 0.9, 0.95]
  revealed_rgba: [0.85, 0.87, 0.9, 0.08]

# Parts of rig.step to draw specially (STEP node name -> rgba).
part_colors:
  "Hot mirror part:1": [0.75, 0.85, 0.95, 0.25]  # eye-tracker hot mirror
