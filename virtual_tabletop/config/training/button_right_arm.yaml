# The button task with one arm (user, 2026-11-01): as touch_right_arm, but
# reward = button press, shaping toward the button, 1M steps.
name: button_right_arm
seed: 0
eval_every: 100000      # env steps between evaluations
eval_trials: 100        # trials per evaluation (unshaped success rate)

env:
  task: foraging_ordered
  reward: button
  num_trials: 5             # trials per episode
  response_timeout: 3.0     # s (the rig's is 0.5 s; a later curriculum step)
  trial_order: random       # objects, poses sampled per trial
  released_arms: [right]    # every trial releases the right arm
  controlled_arms: [right]  # the agent moves its 7 arm joints; fingers straight
  control: position         # physics, position servos

wrappers:
  max_speed: 3.0            # rad/s for an action of 1 (delta actions)
  shaping_scale: 5.0        # reach-shaping potential per metre (0 = off)
  shaping_target: button    # pull the fingertip toward the button

ppo:
  total_timesteps: 1000000
  n_envs: 8
  n_steps: 1024             # per env per rollout (8192 per update)
  batch_size: 512
  n_epochs: 10
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  net_arch: [128, 128]
  log_std_init: -0.5
