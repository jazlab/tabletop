[program:websockify]
command=websockify --web /usr/share/novnc --file-only --web-auth --auth-plugin novnc_auth.CredentialsFileAuth --auth-source /run/tabletop-novnc/credentials --cert /run/tabletop-novnc/server.crt --key /run/tabletop-novnc/server.key --ssl-only --ssl-version tlsv1_2 "%(ENV_PORT)s" localhost:5900
autorestart=true
