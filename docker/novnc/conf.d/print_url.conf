[program:print_url]
command=bash -c "echo $'#####################\nSecure VNC URL: https://localhost:%(ENV_PORT)s/vnc.html?autoconnect=true\nCredentials: run tt-novnc-security show on the host\n#####################'; sleep 300"
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
