# Archived/reference code under deprecated/ is preserved as-is and not linted,
# formatted, or otherwise checked.
exclude: '^deprecated/'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: detect-private-key
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-yaml
        args: [--unsafe]
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: debug-statements
      - id: name-tests-test
      - id: mixed-line-ending
      - id: requirements-txt-fixer
      - id: pretty-format-json
        args: [--autofix, --no-sort-keys]
        # Notebooks are JSON, so this hook matches them by default and would
        # reformat them at indent=2 — fighting nbstripout, which rewrites them
        # via nbformat at indent=1. Leave .ipynb to nbstripout alone.
        exclude_types: [jupyter]
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/openstack/bashate
    rev: 2.1.1
    hooks:
      - id: bashate
  # Clears outputs and execution counts from notebooks so committed .ipynb
  # files stay diffable and small (embedded plot PNGs otherwise dominate the
  # repo). Also drops the two metadata fields that vary per machine and
  # generate spurious diffs; kernelspec.name is kept so tooling still knows
  # these are Python 3 notebooks.
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
        args:
          - --extra-keys
          - metadata.kernelspec.display_name metadata.language_info.version
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.14.14
    hooks:
      # Run the linter.
      - id: ruff-check
        types_or: [python, pyi]
        exclude: pio_compiledb.py
        args: [--fix]
      # Run the formatter.
      - id: ruff-format
        types_or: [python, pyi]
  # - repo: https://github.com/shellcheck-py/shellcheck-py
  #   rev: v0.11.0.1
  #   hooks:
  #     - id: shellcheck
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v21.1.8
    hooks:
      - id: clang-format
        types_or: [c++, c, cuda]
        args: ["-fallback-style=none"]

  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: v0.6.13
    hooks:
      - id: cmake-format
      - id: cmake-lint
        args:
          [--line-width  220, --disabled-codes=C0307, --suppress-decorations]
