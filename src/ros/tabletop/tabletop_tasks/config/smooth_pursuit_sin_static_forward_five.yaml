# One standard sinusoidal lap and 27 half-second holds, shifted 5 in along world -Y.
# Experimental: mock planning passed once and also exhausted all retries
# on a separate startup. Not a reliable real-rig preset.
tasks:
  - class: SmoothPursuitTask
    kwargs:
      motion_type: sin
      motion_kwargs:
        center_pose:
          position: [0.9525, 0.473, 0.53]
          rpy: [1.5707, 1.5707, 0.0]
        amplitudes: [0.1, 0.1, 0.1]
        periods: [4.3, 6.2, 10.0]
        num_revolutions: 10
        num_segments: 800
      robot_name: right_manipulator
      num_repetitions: 1
      object_id: smooth_pursuit_object
      velocity_scaling_factor: 0.075
      max_motion_generation_attempts: 20
      static_hold_seconds: 0.5
      static_half_span_m: 0.07
