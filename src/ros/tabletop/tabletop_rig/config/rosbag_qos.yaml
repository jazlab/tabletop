# Recorder-side DDS history. Large compressed images use a bounded,
# best-effort queue so a delayed reader cannot build an unbounded reliable
# backlog. Metadata remains reliable because it is small and important.
"/cam_sync/left_front_top_cam/image_raw/compressed": &camera_image
  history: keep_last
  depth: 32
  reliability: best_effort
  durability: volatile

"/cam_sync/left_back_top_cam/image_raw/compressed": *camera_image
"/cam_sync/left_bottom_cam/image_raw/compressed": *camera_image
"/cam_sync/right_front_top_cam/image_raw/compressed": *camera_image
"/cam_sync/right_back_top_cam/image_raw/compressed": *camera_image
"/cam_sync/right_bottom_cam/image_raw/compressed": *camera_image

"/cam_sync/left_front_top_cam/image_raw_unmatched/compressed": *camera_image
"/cam_sync/left_back_top_cam/image_raw_unmatched/compressed": *camera_image
"/cam_sync/left_bottom_cam/image_raw_unmatched/compressed": *camera_image
"/cam_sync/right_front_top_cam/image_raw_unmatched/compressed": *camera_image
"/cam_sync/right_back_top_cam/image_raw_unmatched/compressed": *camera_image
"/cam_sync/right_bottom_cam/image_raw_unmatched/compressed": *camera_image

