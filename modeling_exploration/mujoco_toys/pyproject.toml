[project]
name = "mujoco-toys"
version = "0.1.0"
description = "Small MuJoCo worlds for reward-free (intrinsically motivated) exploration"
requires-python = "~=3.12.0"
dependencies = [
  "mujoco>=3.3",
  "numpy",
  "gymnasium",
  "pillow",
  "imageio",
  "imageio-ffmpeg",
]

[project.scripts]
toys-demo = "mujoco_toys.demo:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mujoco_toys"]

[tool.pytest.ini_options]
markers = ["slow: multi-second tests; skip with -m 'not slow'"]
