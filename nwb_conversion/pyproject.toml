[project]
name = "tabletop-nwb"
version = "0.1.0"
description = "Convert TableTop sessions (rosbag MCAP, EyeLink, video, SpikeGLX) to NWB"
requires-python = "~=3.12.0"
dependencies = [
  "mcap>=1.2",
  "mcap-ros2-support>=0.5",
  "numpy>=2.0",
  "pandas>=2.2",
  "pynwb>=3.0",
  "hdmf>=4.0",
  "pyyaml>=6.0",
  "pytest>=8.0",
  "nwbinspector>=0.6",
]

[project.scripts]
tt-nwb = "tabletop_nwb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tabletop_nwb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
